---
- name: Install packages
  ansible.builtin.dnf:
    name: "{{ packages | default(['git']) }}"
    state: present
  become: true
  when: install_packages
  register: dnf_result

- name: Template a config
  template:
    src: app.conf.j2
    dest: /etc/app.conf
    mode: '0644'
    backup: no
  notify: Restart app
  tags: [config]

- debug:
    msg: "bad spacing {{dnf_result}} and {% if x %}yes{% endif %}"
  vars:
    retries: 3
    unclosed: "{{ oops"
